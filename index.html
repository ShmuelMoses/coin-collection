<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- maximum-scale/user-scalable are deliberately NOT set: blocking pinch
         zoom document-wide also stops you magnifying a small banknote, and the
         map does its own pinch handling anyway (see #map's touch-action). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Collections</title>
    <!-- App icon: the browser-tab favicon (Windows/desktop) and the Android
         "Add to Home screen" shortcut icon both come from these two files
         (icons/icon-192.png, icons/icon-512.png) plus manifest.json - all
         three need to sit next to index.html in the repo. -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5a3d22">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <!-- Leaflet 1.9.4, served from this repo rather than a CDN. Loading it
         from unpkg meant a CDN outage didn't degrade the app, it broke it
         outright: L would be undefined and nothing rendered at all. These two
         files sit next to index.html and must be committed with it.
         (leaflet.css references images/layers.png and images/marker-icon.png,
         which are NOT included - this app draws only polygons and tooltips,
         uses no default markers, and hides the layers/zoom controls, so no
         element ever matches those rules and the browser never requests them.) -->
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        /* Antique/parchment palette - the app's only theme now (the
           futuristic dark theme + toggle button were removed by request). */
        :root {
            --bg-solid: #ece2c8;
            --bg-translucent: rgba(236, 226, 200, 0.88);
            --panel-alt: #ddcda3;
            --accent-owned: #4b6b3a;
            --accent-none: #a13d2b;
            --muted: #a89a78;
            --text: #3b2a1a;
            --text-dim: rgba(59,42,26,0.55);
            --border: rgba(59,42,26,0.25);
            --map-bg: #e3d5ae;
            --label-halo: rgba(236,226,200,0.95);
            /* Map-layer colors. Leaflet needs these as JS values, and they are
               read from here at startup (see cssVar) rather than duplicated in
               the script - this block is the only place a color is defined. */
            --map-border: rgba(59,42,26,0.45);
            --frame: #5a3d22;
            --frame-light: #e8dcbb;
        }
        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: var(--bg-solid);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: var(--panel-alt);
            padding: 30px 40px;
            border-radius: 12px;
            width: 360px;
            text-align: center;
            border: 1px solid var(--border);
        }
        h1 { font-size: 20px; margin-bottom: 20px; }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 6px;
            border: none;
            font-size: 15px;
            cursor: pointer;
        }
        .primary-btn { background: var(--accent-owned); color: var(--bg-solid); font-weight: bold; }
        .collection-item {
            background: var(--bg-solid);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .collection-item:hover { border-color: var(--accent-owned); }
        .delete-collection-btn {
            width: auto; margin: 0; padding: 4px 8px; background: transparent;
            border: 1px solid transparent; color: var(--text-dim); font-size: 15px; border-radius: 6px;
        }
        .delete-collection-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-dim); }
        #status { font-size: 13px; color: var(--text-dim); margin-top: 16px; }

        /* ===== Collection view (map/list/search/modal) ===== */
        #collection-view { display: flex; height: 100vh; width: 100vw; position: fixed; top:0; left:0; }
        /* Desktop: the sidebar is a floating card over the map (not a full-height
           column) - it takes itself out of the flex layout via position:absolute,
           so #cv-main automatically expands to fill the whole viewport underneath
           it. Height is automatic, based on its own content (how many buttons/
           rows it has), capped so it never runs off the bottom of a short window. */
        /* #cv-sidebar lays its 3 children out with flexbox (not just plain
           block stacking) purely so `order` can put them in a different
           visual order on phones (see the media query below) without
           needing separate/duplicated markup: the title, the version
           number, and the controls row (icon buttons + search box). */
        #cv-sidebar {
            position: absolute; top: 20px; left: 20px; z-index: 500;
            width: 230px; max-height: calc(100vh - 40px); overflow-y: auto;
            background: var(--bg-translucent); backdrop-filter: blur(6px); color: var(--text);
            padding: 20px; border: 1px solid var(--border); border-radius: 10px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.35);
            display: flex; flex-direction: column;
        }
        #cv-title { order: 1; font-size: 24px; margin: 0 0 16px 0; color: var(--accent-owned); text-align: center; }
        /* This is a real <button> (it opens the cache panel, so it must be
           focusable and announced as a control) - the width/padding/font
           resets undo the global `button` rule so it still looks like the
           plain caption it was as a <div>. */
        #app-version {
            order: 3; text-align: center; font-size: 10px; color: var(--text-dim);
            opacity: 0.6; margin-top: 8px; cursor: pointer;
            width: auto; padding: 0; background: none; border: none;
            font-family: inherit; display: block;
        }
        #app-version:hover { opacity: 1; }
        #cv-controls-row { order: 2; }
        .app-version { text-align: center; font-size: 10px; color: var(--text-dim); opacity: 0.6; margin-top: 16px; }

        /* Phones: sidebar becomes a compact bar across the TOP instead of a
           floating card, so it blocks as little of the map as possible.
           Laid out as a 2-row grid: title + version number on row 1,
           the icon buttons + search box together on row 2. */
        @media (max-width: 700px) {
            #collection-view { flex-direction: column; }
            #cv-sidebar {
                position: static; top: auto; left: auto; max-height: none;
                box-shadow: none; border-radius: 0; backdrop-filter: none;
                background: var(--bg-solid);
                width: 100%; height: auto;
                border: none; border-bottom: 1px solid var(--border);
                display: grid; grid-template-columns: 1fr auto;
                grid-template-areas: "title version" "controls controls";
                align-items: center; gap: 4px 10px;
                padding: 8px 10px;
            }
            #cv-title { grid-area: title; font-size: 28px; font-weight: 700; margin: 0; text-align: left; }
            #app-version { grid-area: version; margin-top: 0; }
            #cv-controls-row {
                grid-area: controls; display: flex; align-items: center; gap: 6px;
            }
            #icon-row { margin-bottom: 0; gap: 6px; align-items: center; }
            /* Cancel the desktop "stretch to fill the row" sizing (flex:1 +
               aspect-ratio) - here the icon row sits BESIDE the search box
               instead of stacked above it, so buttons go back to a fixed
               square size. That size (30px) is also given to the search
               box explicitly below, so the two end up exactly the same
               height and sit flush together instead of looking offset. */
            .icon-btn { flex: 0 0 30px; aspect-ratio: auto; width: 30px; height: 30px; font-size: 14px; }
            .search-wrap { margin-bottom: 0; flex: 1 1 140px; min-width: 100px; align-self: center; }
            /* Height/line-height/appearance are all pinned explicitly - a
               plain "height:30px" alone wasn't enough to line these up with
               the buttons on every mobile browser (Android's default text-
               input chrome can add its own intrinsic padding that isn't
               there in a desktop test), so this removes that native styling
               entirely instead of fighting it. */
            #search-box, #search-ghost {
                height: 30px; line-height: 28px; font-size: 12px; padding: 0 8px;
                -webkit-appearance: none; appearance: none;
            }
            .legend-btn { font-size: 11px; padding: 6px 8px; margin-bottom: 0; width: auto; }
            .box { max-width: 92vw; padding: 24px 20px; }
            /* No override needed here anymore - #list-view's plain base
               padding (20px all around) already applies; the extra desktop
               padding-left lives only in its own @media (min-width:701px)
               rule above, so it can never leak into this range. */
        }
        .search-wrap { position: relative; margin-bottom: 16px; }
        #search-box, #search-ghost {
            width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
            font-size: 14px; background: transparent; color: var(--text);
        }
        #search-box { position: relative; z-index: 2; }
        #search-ghost { position: absolute; top: 0; left: 0; background: var(--panel-alt); color: var(--text-dim); pointer-events: none; z-index: 1; }
        .legend-btn {
            display: flex; align-items: center; gap: 8px; width: 100%; background: var(--panel-alt);
            border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 6px;
            cursor: pointer; font-size: 13px; margin-bottom: 8px;
        }
        .legend-btn.active { border-color: currentColor; background: rgba(255,255,255,0.08); }
        .legend-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
        /* Buttons stretch to fill the row (instead of a fixed pixel width)
           so the row's rendered width always exactly matches the search
           box below it (width:100% of the same container) - a fixed
           width here previously didn't add up to the container's actual
           width and made the two rows look mismatched. */
        #icon-row { display: flex; gap: 6px; margin-bottom: 16px; }
        .icon-btn {
            flex: 1 1 0; min-width: 0; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            background: var(--panel-alt); border: 1px solid var(--border); border-radius: 6px; color: var(--text);
            cursor: pointer; padding: 0; font-size: 16px; line-height: 1;
        }
        .icon-btn:hover { border-color: var(--accent-owned); }
        .icon-btn.active { border-color: var(--accent-owned); background: rgba(0,0,0,0.08); }
        #cv-main { flex: 1; position: relative; transition: filter 0.2s; }
        #cv-main.dimmed { filter: brightness(0.55); }
        /* Leaflet handles its own pinch/drag gestures here, so the browser's
           native page gestures are suppressed on the map only - rather than
           document-wide via the viewport meta, which used to also block
           pinch-zooming a photo. */
        #map { height: 100%; width: 100%; background: var(--map-bg); touch-action: none; }
        /* Keyboard focus was previously invisible everywhere. */
        :focus-visible { outline: 2px solid var(--accent-owned); outline-offset: 2px; }
        /* Decorative antique-map compass rose is added as a real Leaflet
           SVG overlay layer anchored to lat/lng in initMap() (not a
           fixed-pixel marker/divIcon), specifically so it scales with the
           map instead of staying a constant screen size while zooming. */
        .compass-rose-overlay { color: var(--text); opacity: 0.6; pointer-events: none; }
        .country-label {
            background: transparent; border: none; box-shadow: none; font-size: 11px; font-weight: bold;
            color: var(--text); text-shadow: 0 0 3px var(--label-halo), 0 0 3px var(--label-halo);
        }
        .country-label::before { display: none; } /* hide Leaflet's default tooltip arrow/wedge */
        .leaflet-container path:focus { outline: none; }
        /* Zoom is available via scroll/pinch already - the +/- buttons are
           redundant clutter, so they're hidden everywhere */
        .leaflet-control-zoom { display: none !important; }
        #list-view {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow-y: auto; padding: 20px; background: var(--bg-translucent); z-index: 400;
        }
        /* The extra left padding (desktop only) and its mobile override used
           to both be plain #list-view rules with equal specificity - which
           one "wins" then just came down to source order, and they'd
           silently swapped at some point, so mobile was picking up the
           desktop padding instead of its own override. Scoping each to its
           own media query removes the ambiguity for good - only one of
           these can ever match a given viewport. */
        @media (min-width: 701px) {
            /* The floating sidebar card sits on top of this view (see
               #cv-sidebar) and would otherwise cover the left edge of every
               row, hiding country names. */
            #list-view { padding-left: 270px; }
        }
        #list-stats {
            text-align: center; font-size: 13px; color: var(--text-dim);
            padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border);
        }
        .country-item {
            background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 8px;
            padding: 12px 16px; margin-bottom: 10px; cursor: pointer; display: flex;
            justify-content: space-between; align-items: center; color: var(--text);
        }
        .country-item:hover { background: rgba(75,107,58,0.15); border-color: var(--accent-owned); }
        .country-item .count { color: var(--accent-owned); font-weight: bold; }
        #modal-backdrop { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: transparent; z-index: 1000; }
        #modal {
            display: none; position: fixed; top: 8%; left: 50%; transform: translateX(-50%);
            width: fit-content; max-width: 90%; max-height: 80%; overflow-y: auto;
            background: var(--bg-translucent); backdrop-filter: blur(6px); color: var(--text);
            border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 4px 30px rgba(0,0,0,0.6);
            z-index: 1001; padding: 20px;
        }
        #modal h2 { margin: 0; color: var(--accent-owned); line-height: 1.2; }
        #modal-header {
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
            gap: 6px; margin-bottom: 18px;
        }
        #modal-header h2 { text-align: center; white-space: nowrap; }
        .modal-header-side { display: flex; align-items: center; gap: 10px; min-height: 24px; }
        .modal-header-left { justify-content: flex-start; }
        .modal-header-right { justify-content: flex-end; }
        #share-icon-btn, #share-confirm-icon-btn, #share-cancel-icon-btn,
        #organize-icon-btn, #organize-confirm-icon-btn, #organize-cancel-icon-btn {
            width: auto; padding: 0; margin: 0; background: transparent; border: none;
            color: var(--accent-owned); cursor: pointer; display: flex; align-items: center;
        }
        #share-cancel-icon-btn, #organize-cancel-icon-btn { color: var(--accent-none); }
        #organize-icon-btn { color: var(--text-dim); }
        #share-icon-btn:hover, #share-confirm-icon-btn:hover,
        #organize-icon-btn:hover, #organize-confirm-icon-btn:hover { opacity: 0.75; }
        #modal-images { display: block; }
        /* Thumbnail grid: the column count comes from the space available, not
           from the number of photos. It used to be min(5, ceil(sqrt(n))), which
           capped a 40-note country at 5 columns on any screen and left most of a
           desktop window empty. auto-fill also removes the need for a mobile
           media query - it collapses to 1-2 columns on its own. */
        /* --cols is set per group in renderImageGroup (photo count, capped at
           6) so the modal still hugs its content for a country with 2 notes,
           while auto-fill inside that width collapses the columns further on a
           narrow phone. #modal is width:fit-content, so the grid needs a
           definite width here - 1fr tracks alone would resolve against an
           indefinite container and put everything on one row. */
        .thumb-grid {
            display: grid; gap: 10px; margin: 0 auto;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            width: min(86vw, calc(var(--cols, 4) * 140px));
        }
        #modal-images img {
            width: 100%; height: 130px; object-fit: contain; background: rgba(255,255,255,0.06);
            border-radius: 6px; border: 1px solid var(--border); cursor: pointer; padding: 4px;
            display: block; transition: opacity 0.15s ease;
        }
        /* Shown over a thumbnail while its image is still downloading -
           Drive has to serve the full-res file first (see fetchFullImageBlob),
           which can take a while for a country with many/large photos. */
        .thumb-spinner {
            position: absolute; top: 50%; left: 50%; width: 22px; height: 22px;
            margin: -11px 0 0 -11px; border: 2px solid var(--border); border-top-color: var(--accent-owned);
            border-radius: 50%; animation: thumb-spin 0.8s linear infinite; pointer-events: none;
        }
        @keyframes thumb-spin { to { transform: rotate(360deg); } }
        #enlarge-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; text-align: center;
        }
        #enlarge-overlay img { max-width: 90%; max-height: 90%; margin-top: 5vh; border-radius: 8px; }
        #cache-modal-backdrop { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1500; }
        #cache-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 280px; max-width: 90%; background: var(--bg-translucent); backdrop-filter: blur(6px);
            color: var(--text); border: 1px solid var(--border); border-radius: 10px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.6); z-index: 1501; padding: 20px; text-align: center;
        }
        #cache-modal h3 { margin: 0 0 12px 0; color: var(--accent-owned); }
        #cache-modal-stats { font-size: 13px; color: var(--text-dim); margin: 0 0 18px 0; line-height: 1.6; }
        #cache-modal-actions { display: flex; gap: 8px; }
        #cache-modal-actions .legend-btn { justify-content: center; margin-bottom: 0; }

        /* ===== Themed dialogs (replacing alert/confirm/prompt) ===== */
        /* Built on demand by js/dialog.js - the native browser dialogs were
           the only part of the app that looked like a plain web page. */
        .dialog-backdrop {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
            z-index: 3000; align-items: center; justify-content: center; padding: 20px;
        }
        .dialog-backdrop.open { display: flex; }
        .dialog-box {
            width: 340px; max-width: 100%; background: var(--bg-translucent);
            backdrop-filter: blur(6px); color: var(--text);
            border: 1px solid var(--border); border-radius: 10px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.6); padding: 20px; text-align: center;
        }
        .dialog-box h3 { margin: 0 0 12px 0; color: var(--accent-owned); font-size: 17px; }
        .dialog-message { font-size: 13px; color: var(--text); margin: 0 0 16px 0; line-height: 1.6; }
        .dialog-input {
            width: 100%; padding: 8px 10px; margin-bottom: 16px; font-size: 14px;
            border-radius: 6px; border: 1px solid var(--border);
            background: var(--panel-alt); color: var(--text);
            font-family: inherit; -webkit-appearance: none; appearance: none;
        }
        .dialog-actions { display: flex; gap: 8px; }
        .dialog-actions .legend-btn { justify-content: center; margin-bottom: 0; }
        .dialog-actions .dialog-confirm {
            background: var(--accent-owned); color: var(--bg-solid); font-weight: bold;
            border-color: var(--accent-owned);
        }
    </style>
</head>
<body>

    <div class="box" id="login-box">
        <h1 id="title">My Collections</h1>
        <div id="content">
            <button id="signin-btn" class="primary-btn" disabled>Loading...</button>
        </div>
        <div id="status"></div>
        <div class="app-version" id="login-version"></div>
    </div>

    <!-- ===== Full collection view (map / list / search / modal) ===== -->
    <div id="collection-view" style="display:none;">
        <div id="cv-sidebar">
            <h1 id="cv-title"></h1>
            <button id="app-version" title="Thumbnail cache info" aria-label="Thumbnail cache info"></button>
            <div id="cv-controls-row">
                <div id="icon-row">
                    <button id="back-btn" class="icon-btn" title="Back to My Collections" aria-label="Back to My Collections">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <g transform="scale(-1,1) translate(-24,0)">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                <polyline points="16 17 21 12 16 7"/>
                                <line x1="21" y1="12" x2="9" y2="12"/>
                            </g>
                        </svg>
                    </button>
                    <button id="view-toggle-btn" class="icon-btn" title="Switch to List view" aria-label="Switch to List view"></button>
                    <button id="color-mode-btn" class="icon-btn" title="Coloring: Have items + None yet" aria-label="Coloring: Have items + None yet">
                        <span class="legend-dot" id="color-mode-dot" style="background:linear-gradient(90deg, var(--accent-owned), var(--accent-none));"></span>
                        <span id="color-mode-label" style="display:none;"></span>
                    </button>
                    <button id="reset-btn" class="icon-btn" title="Reset view" aria-label="Reset view">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
                    </button>
                    <button id="export-btn" class="icon-btn" title="Export whole collection" aria-label="Export whole collection">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    </button>
                </div>
                <div class="search-wrap">
                    <input type="text" id="search-ghost" tabindex="-1" disabled>
                    <input type="text" id="search-box" placeholder="Search" autocomplete="off">
                </div>
            </div>
        </div>
        <div id="cv-main">
            <div id="map"></div>
            <div id="list-view"></div>
        </div>
        <div id="modal-backdrop"></div>
        <div id="modal">
            <div id="modal-header">
                <div class="modal-header-side modal-header-left">
                    <button id="organize-icon-btn" title="Organize into categories" aria-label="Organize into categories">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                    </button>
                    <button id="organize-confirm-icon-btn" title="Save changes" aria-label="Save changes" style="display:none;">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg>
                    </button>
                    <button id="organize-cancel-icon-btn" title="Discard changes" aria-label="Discard changes" style="display:none;">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
                    </button>
                </div>
                <h2 id="modal-title"></h2>
                <div class="modal-header-side modal-header-right">
                    <button id="share-cancel-icon-btn" title="Cancel" aria-label="Cancel sharing" style="display:none;">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
                    </button>
                    <button id="share-icon-btn" title="Share this country" aria-label="Share this country">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <g transform="translate(3.21,-2.15) scale(0.664)" fill="currentColor">
                                <path d="M22 6.5c-.7.4-1.5.6-2.3.7.8-.5 1.4-1.3 1.7-2.3-.8.5-1.6.8-2.5 1-1.6-1.7-4.3-1.5-5.6.4-.5.7-.7 1.6-.5 2.4-3-.1-5.6-1.5-7.4-3.7-.9 1.6-.4 3.7 1.2 4.7-.6 0-1.2-.2-1.7-.5 0 1.7 1.2 3.1 2.8 3.5-.5.1-1 .2-1.6.1.4 1.4 1.8 2.4 3.3 2.5-1.5 1.1-3.3 1.6-5.2 1.4 1.7 1 3.6 1.6 5.6 1.6 6.7 0 10.5-5.6 10.3-10.6.7-.5 1.3-1.2 1.8-1.9z"/>
                            </g>
                            <rect x="7" y="13" width="10" height="7" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.4"/>
                            <path d="M7 13.3 12 17 17 13.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <button id="share-confirm-icon-btn" title="Share selected" aria-label="Share selected photos" style="display:none;">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg>
                    </button>
                </div>
            </div>
            <div id="modal-images"></div>
        </div>
        <div id="enlarge-overlay">
            <img id="enlarge-img" src="">
        </div>
        <!-- Drive's appData space is hidden from Drive's own UI by design
             (that's why it was chosen for the thumbnail cache - see
             getDriveThumbIndex), so this is the only way to actually see
             what's cached: click the version number to open it. -->
        <div id="cache-modal-backdrop"></div>
        <div id="cache-modal">
            <h3>Thumbnail cache</h3>
            <p id="cache-modal-stats">Loading…</p>
            <div id="cache-modal-actions">
                <button id="cache-clear-btn" class="legend-btn">Clear cache</button>
                <button id="cache-close-btn" class="legend-btn">Close</button>
            </div>
        </div>
    </div>

    <!-- The app is a set of native ES modules under js/ - no build step, no
         bundler; the browser resolves the imports itself and GitHub Pages
         serves them as-is. Splitting it up removed the last of the
         window._* globals and makes a duplicate top-level function name
         (which once silently broke thumbnail caching for weeks) impossible.
         Note: ES modules need a real http(s) origin, so opening index.html
         from the filesystem with a file:// URL will not work - serve the
         folder (e.g. `python -m http.server 8000`) when testing locally. -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
