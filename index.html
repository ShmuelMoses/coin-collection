                const spinner = document.createElement('div');
                spinner.className = 'thumb-spinner';
                wrapper.appendChild(spinner);

                const el = document.createElement('img');
                const refreshSelectedLook = () => {
                    const isSelected = selectedForShare.has(img.id);
                    el.style.opacity = (shareSelectMode && !isSelected) ? '0.3' : '1';
                };
                el.onclick = () => {
                    if (shareSelectMode) {
                        if (selectedForShare.has(img.id)) selectedForShare.delete(img.id);
                        else selectedForShare.add(img.id);
                        refreshSelectedLook();
                    } else {
                        showEnlarged(img.id);
                    }
                };
                refreshSelectedLook();
                wrapper.appendChild(el);
                getThumbnailBlobUrl(img.id)
                    .then(url => { el.src = url; spinner.remove(); })
                    .catch(err => { console.error('Thumbnail failed for', img.id, img.name, ':', err); spinner.remove(); });

                grid.appendChild(wrapper);
            });
            return grid;
        }

        let editingCategoryIndex = null; // which category's name is currently being edited
        let draftUncategorizedOrder = []; // explicit manual order for Uncategorized, like a category's imageIds

        // Returns the array that currently "owns" an image's order:
        // draftUncategorizedOrder for -1, or that category's imageIds.
        function orderArrayFor(categoryIndex) {
            return categoryIndex === -1 ? draftUncategorizedOrder : draftCategories[categoryIndex].imageIds;
        }

        // Moves an image up/down between categories (or to/from
        // Uncategorized). Creates a new category automatically if you
        // move past the first or last one.
        function moveImageDirection(img, currentCatIndex, direction) {
            const currentArr = orderArrayFor(currentCatIndex);
            const idx = currentArr.indexOf(img.id);
            if (idx !== -1) currentArr.splice(idx, 1);

            let targetIndex = currentCatIndex + direction;
            if (direction === -1 && targetIndex < -1) {
                draftCategories.unshift({ name: 'New category', imageIds: [] });
                targetIndex = 0;
            } else if (direction === 1 && targetIndex >= draftCategories.length) {
                draftCategories.push({ name: 'New category', imageIds: [] });
                targetIndex = draftCategories.length - 1;
            }
            orderArrayFor(targetIndex).push(img.id);
            renderModalContent(currentModalCode);
        }

        function reorderWithin(categoryIndex, pos, direction) {
            const arr = orderArrayFor(categoryIndex);
            const newPos = pos + direction;
            if (newPos < 0 || newPos >= arr.length) return;
            [arr[pos], arr[newPos]] = [arr[newPos], arr[pos]];
            renderModalContent(currentModalCode);
        }

        // Merges an explicit manual order with any images that don't
        // appear in it yet (new/unordered ones get appended at the end).
        function applyOrder(orderIds, images) {
            const ordered = orderIds.map(id => images.find(i => i.id === id)).filter(Boolean);
            const missing = images.filter(img => !orderIds.includes(img.id));
            return ordered.concat(missing);
        }

        // Renders the editable "organize" UI: new-category input, an
        // Uncategorized bucket, and each category with rename/reorder/
        // delete controls plus per-image move controls.
        function renderOrganizeSection(uncategorizedRaw, allOwnImages) {
            const container = modalImages;
            const uncategorized = applyOrder(draftUncategorizedOrder, uncategorizedRaw);
            // Keep draftUncategorizedOrder as a COMPLETE, position-matched
            // list (not just the items someone has manually moved) - this
            // is what makes the left/right reorder buttons actually work
            // on it, the same way a real category's imageIds array does.
            draftUncategorizedOrder = uncategorized.map(img => img.id);

            // (Categories are created automatically via the ▲/▼ buttons
            // on a photo, so there's no separate "add category" control.)

            // Builds a compact directional pad: ▲ on top, ◀ ▶ in the
            // middle row, ▼ on the bottom - arranged like a plus sign.
            function buildDpad(categoryIndex, posInCategory, categoryLength) {
                const grid = document.createElement('div');
                grid.style.cssText = 'display:grid;grid-template-columns:28px 28px 28px;grid-template-rows:26px 26px 26px;gap:3px;justify-content:center;margin:4px auto 0 auto;width:fit-content;';

                function mk(txt, row, col, disabled, onClick, title) {
                    const b = document.createElement('button');
                    b.textContent = txt;
                    b.disabled = disabled;
                    b.title = title;
                    b.style.cssText = `grid-row:${row};grid-column:${col};display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;padding:0;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);border-radius:4px;cursor:pointer;${disabled ? 'opacity:0.3;' : ''}`;
                    b.onclick = onClick;
                    return b;
                }

                grid.appendChild(mk('▲', 1, 2, false, null, 'Move to previous category'));
                grid.appendChild(mk('◀', 2, 1, posInCategory === 0, null, 'Move earlier'));
                grid.appendChild(mk('▶', 2, 3, posInCategory === categoryLength - 1, null, 'Move later'));
                grid.appendChild(mk('▼', 3, 2, false, null, 'Move to next category'));

                // Wire callbacks after creation (need the actual image ref)
                return grid;
            }

            function imageCell(img, categoryIndex, posInCategory, categoryLength) {
                const wrapper = document.createElement('div');
                wrapper.style.cssText = 'display:inline-block;width:110px;margin:4px;vertical-align:top;text-align:center;';

                const imgBox = document.createElement('div');
                imgBox.style.cssText = 'position:relative;width:90px;height:90px;margin:0 auto;';
                wrapper.appendChild(imgBox);

                const spinner = document.createElement('div');
                spinner.className = 'thumb-spinner';
                imgBox.appendChild(spinner);

                const el = document.createElement('img');
                el.style.cssText = 'width:90px;height:90px;object-fit:contain;background:rgba(255,255,255,0.06);border-radius:6px;border:1px solid var(--border);padding:2px;';
                imgBox.appendChild(el);
                getThumbnailBlobUrl(img.id)
                    .then(url => { el.src = url; spinner.remove(); })
                    .catch(err => { console.error('Thumbnail failed for', img.id, img.name, ':', err); el.alt = '⚠'; spinner.remove(); });

                const dpad = buildDpad(categoryIndex, posInCategory, categoryLength);
                const buttons = dpad.querySelectorAll('button');
                buttons[0].onclick = () => moveImageDirection(img, categoryIndex, -1); // ▲
                buttons[1].onclick = () => reorderWithin(categoryIndex, posInCategory, -1); // ◀
                buttons[2].onclick = () => reorderWithin(categoryIndex, posInCategory, 1);  // ▶
                buttons[3].onclick = () => moveImageDirection(img, categoryIndex, 1);  // ▼
                wrapper.appendChild(dpad);

                return wrapper;
            }

            // Uncategorized bucket - only labeled once categories exist
            const uncatWrap = document.createElement('div');
            uncatWrap.style.cssText = 'text-align:center;';
            if (draftCategories.length > 0) {
                const uncatHeading = document.createElement('h3');
                uncatHeading.textContent = 'Uncategorized';
                uncatHeading.style.cssText = HEADING_STYLE;
                container.appendChild(uncatHeading);
            }
            uncategorized.forEach((img, pos) => uncatWrap.appendChild(imageCell(img, -1, pos, uncategorized.length)));
            if (uncategorized.length === 0 && draftCategories.length > 0) {
                const empty = document.createElement('p');
                empty.textContent = '(none)'; empty.style.cssText = 'color:var(--text-dim);font-size:12px;';
                uncatWrap.appendChild(empty);
            }
            container.appendChild(uncatWrap);

            draftCategories.forEach((cat, catIdx) => {
                const header = document.createElement('div');
                header.style.cssText = 'display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0 6px 0;border-top:1px solid var(--border);padding-top:12px;';

                const nameContainer = document.createElement('div');
                nameContainer.style.cssText = 'display:flex;align-items:center;gap:6px;flex:1;min-width:140px;';

                if (editingCategoryIndex === catIdx) {
                    const nameInput = document.createElement('input');
                    nameInput.type = 'text'; nameInput.value = cat.name;
                    nameInput.style.cssText = 'flex:1;min-width:120px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--panel-alt);color:var(--text);font-size:14px;';
                    nameInput.oninput = () => { cat.name = nameInput.value; };
                    nameInput.onkeydown = (e) => { if (e.key === 'Enter') { editingCategoryIndex = null; renderModalContent(currentModalCode); } };
                    nameContainer.appendChild(nameInput);

                    const saveBtn = document.createElement('button');
                    saveBtn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg>';
                    saveBtn.title = 'Save name';
                    saveBtn.style.cssText = 'flex-shrink:0;background:transparent;border:none;color:var(--accent-owned);cursor:pointer;padding:2px;display:flex;';
                    saveBtn.onclick = () => { editingCategoryIndex = null; renderModalContent(currentModalCode); };
                    nameContainer.appendChild(saveBtn);
                } else {
                    const nameLabel = document.createElement('span');
                    nameLabel.textContent = cat.name && cat.name.trim() ? cat.name : 'Untitled category';
                    nameLabel.style.cssText = 'flex:1;min-width:60px;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
                    nameContainer.appendChild(nameLabel);

                    const editBtn = document.createElement('button');
                    editBtn.innerHTML = '&#9998;';
                    editBtn.title = 'Rename';
                    editBtn.style.cssText = 'flex-shrink:0;background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:13px;padding:2px;';
                    editBtn.onclick = () => { editingCategoryIndex = catIdx; renderModalContent(currentModalCode); };
                    nameContainer.appendChild(editBtn);
                }
                header.appendChild(nameContainer);

                const delBtn = document.createElement('button');
                delBtn.innerHTML = '&#128465;';
                delBtn.title = 'Delete category (images become uncategorized)';
                delBtn.style.cssText = 'flex-shrink:0;width:26px;height:26px;padding:0;background:transparent;border:1px solid var(--border);color:var(--accent-none);border-radius:4px;cursor:pointer;';
                delBtn.onclick = () => {
                    // images in this category go back to being uncategorized
                    draftUncategorizedOrder = draftUncategorizedOrder.concat(cat.imageIds);
                    draftCategories.splice(catIdx, 1);
                    if (editingCategoryIndex === catIdx) editingCategoryIndex = null;
                    renderModalContent(currentModalCode);
                };
                header.appendChild(delBtn);

                container.appendChild(header);

                const catWrap = document.createElement('div');
                catWrap.style.cssText = 'text-align:center;';
                const imgs = cat.imageIds.map(id => allOwnImages.find(i => i.id === id)).filter(Boolean);
                imgs.forEach((img, pos) => catWrap.appendChild(imageCell(img, catIdx, pos, imgs.length)));
                if (imgs.length === 0) {
                    const empty = document.createElement('p');
                    empty.textContent = '(empty - use ▲ on a photo above to move it here)';
                    empty.style.cssText = 'color:var(--text-dim);font-size:12px;';
                    catWrap.appendChild(empty);
                }
                container.appendChild(catWrap);
            });
        }

        // Renders whichever mode is currently active (normal view, or the
        // organize editor) for the given country code.
        function renderModalContent(code) {
            const entry = cvCountryMap[code];
            if (!entry) return;
            modalTitle.textContent = COUNTRY_NAMES[code] || code;
            modalImages.innerHTML = '';

            const categories = organizeMode ? draftCategories : getCountryLayout(code).categories;
            const categorizedIds = new Set(categories.flatMap(c => c.imageIds));
            const uncategorizedRaw = entry.own.filter(img => !categorizedIds.has(img.id));
            const uncategorized = organizeMode ? uncategorizedRaw : applyOrder(getCountryLayout(code).uncategorizedOrder, uncategorizedRaw);

            if (organizeMode) {
                renderOrganizeSection(uncategorized, entry.own);
                return; // historical entries aren't editable in this pass
            }

            if (uncategorized.length > 0) {
                if (categories.length > 0) {
                    const heading = document.createElement('h3');
                    heading.textContent = 'Uncategorized';
                    heading.style.cssText = HEADING_STYLE;
                    modalImages.appendChild(heading);
                }
                modalImages.appendChild(renderImageGroup(uncategorized));
            }

            categories.forEach(cat => {
                const imgs = cat.imageIds.map(id => entry.own.find(i => i.id === id)).filter(Boolean);
                if (imgs.length === 0) return;
                const heading = document.createElement('h3');
                heading.textContent = cat.name;
                heading.style.cssText = HEADING_STYLE;
                modalImages.appendChild(heading);
                modalImages.appendChild(renderImageGroup(imgs));
            });

            Object.entries(entry.historical).forEach(([histCode, images]) => {
                if (images.length === 0) return;
                const heading = document.createElement('h3');
                heading.textContent = COUNTRY_NAMES[histCode] || histCode;
                heading.style.cssText = HEADING_STYLE;
                modalImages.appendChild(heading);
                modalImages.appendChild(renderImageGroup(images));
            });
        }

        async function openModal(code) {
            const entry = cvCountryMap[code];
            if (!entry) return;
            currentModalCode = code;
            organizeMode = false;

            const allImages = entry.own.concat(...Object.values(entry.historical));
            selectedForShare = new Set(allImages.map(img => img.id));
            shareSelectMode = false;
            updateHeaderIcons();

            renderModalContent(code);

            modal.style.display = 'block';
            modalBackdrop.style.display = 'block';
            document.getElementById('cv-main').classList.add('dimmed');
            history.pushState({ screen: 'modal' }, '');
        }

        function closeModal(fromPopstate) {
            modal.style.display = 'none';
            modalBackdrop.style.display = 'none';
            document.getElementById('cv-main').classList.remove('dimmed');
            if (!fromPopstate) {
                suppressNextPopstate = true;
                history.back(); // consumes the 'modal' state we pushed when it opened
            }
        }
        modalBackdrop.onclick = () => closeModal(false);

        // ---------- Share: builds one self-contained HTML file with all
        // of a country's images embedded directly (base64) - no Drive
        // access, no sign-in, and no waiting needed for whoever opens it ----------
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        // Resizes an image blob down by a factor (e.g. 4 = quarter the
        // width and height) - used to shrink shared files significantly.
        function resizeImageBlobByFactor(blob, factor) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const objUrl = URL.createObjectURL(blob);
                img.onload = () => {
                    const width = Math.max(1, Math.round(img.width / factor));
                    const height = Math.max(1, Math.round(img.height / factor));
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    canvas.toBlob(resolve, 'image/jpeg', 0.8);
                    URL.revokeObjectURL(objUrl);
                };
                img.onerror = () => {
                    reject(new Error(`Could not decode image (blob type="${blob.type}", size=${blob.size} bytes)`));
                };
                img.src = objUrl;
            });
        }

        // Uses the device's native share sheet (Android, and some desktop
        // browsers) when available; otherwise falls back to a normal file
        // download, which works everywhere.
        async function shareOrDownloadFile(blob, filename) {
            if (navigator.share) {
                const file = new File([blob], filename, { type: 'text/html' });
                // Some Android browsers report canShare()=false for
                // text/html specifically even though sharing still works,
                // so we don't let that check block us - only a real
                // failure from navigator.share falls back to download.
                const canTry = !navigator.canShare || navigator.canShare({ files: [file] });
                if (canTry) {
                    try {
                        await navigator.share({ files: [file], title: filename });
                        return;
                    } catch (err) {
                        if (err.name === 'AbortError') return; // user cancelled the share sheet
                        console.error('Share failed, falling back to download:', err);
                    }
                }
            }
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
        }

        document.getElementById('share-confirm-icon-btn').onclick = async () => {
            const code = currentModalCode;
            const entry = cvCountryMap[code];
            if (!entry) return;

            // Build the same ordered groups shown in the modal (Uncategorized
            // first, then saved categories in order, then historical entities)
            const layout = getCountryLayout(code);
            const categorizedIds = new Set(layout.categories.flatMap(c => c.imageIds));
            const uncategorizedRaw = entry.own.filter(img => !categorizedIds.has(img.id));
            const uncategorized = applyOrder(layout.uncategorizedOrder, uncategorizedRaw);

            const orderedGroups = [];
            if (uncategorized.length > 0) {
                orderedGroups.push({ heading: layout.categories.length > 0 ? 'Uncategorized' : null, images: uncategorized });
            }
            layout.categories.forEach(cat => {
                const imgs = cat.imageIds.map(id => entry.own.find(i => i.id === id)).filter(Boolean);
                if (imgs.length > 0) orderedGroups.push({ heading: cat.name, images: imgs });
            });
            Object.entries(entry.historical).forEach(([histCode, images]) => {
                if (images.length > 0) orderedGroups.push({ heading: COUNTRY_NAMES[histCode] || histCode, images });
            });

            const allImages = orderedGroups.flatMap(g => g.images);
            const selectedImages = allImages.filter(img => selectedForShare.has(img.id));
            if (selectedImages.length === 0) {
                alert('Select at least one image to share (tap a photo to select it).');
                return;
            }

            const btn = document.getElementById('share-confirm-icon-btn');
            btn.style.opacity = '0.4';
            btn.style.pointerEvents = 'none';

            let bodyHtml = '';
            for (const group of orderedGroups) {
                const groupSelected = group.images.filter(img => selectedForShare.has(img.id));
                if (groupSelected.length === 0) continue;
                if (group.heading) bodyHtml += `<h3>${group.heading}</h3>`;
                bodyHtml += '<div class="grid">';
                for (const img of groupSelected) {
                    const fullBlob = await fetchFullImageBlob(img.id);
                    const smallBlob = await resizeImageBlobByFactor(fullBlob, 4); // 1/4 resolution
                    const dataUrl = await blobToBase64(smallBlob);
                    bodyHtml += `<img src="${dataUrl}">`;
                }
                bodyHtml += '</div>';
            }

            const countryName = COUNTRY_NAMES[code] || code;
            const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>${countryName} - Banknotes & Coins</title>
<style>
body{font-family:Georgia,'Times New Roman',serif;background:#ece2c8;color:#3b2a1a;padding:24px;text-align:center;}
h1{color:#4b6b3a;}
h3{color:rgba(59,42,26,0.7);font-weight:normal;border-top:1px solid rgba(59,42,26,0.25);padding-top:12px;margin-top:20px;}
.grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
img{max-width:280px;max-height:280px;border-radius:6px;border:1px solid rgba(59,42,26,0.3);
    background:rgba(59,42,26,0.06);padding:4px;box-sizing:border-box;}
</style></head>
<body>
<h1>${countryName}</h1>
${bodyHtml}
</body></html>`;

            const fileBlob = new Blob([html], { type: 'text/html' });
            await shareOrDownloadFile(fileBlob, `${countryName.replace(/\s+/g, '_')}.html`);

            btn.style.opacity = '1';
            btn.style.pointerEvents = 'auto';
            setShareSelectMode(false);
        };

        function showEnlarged(fileId) {
            const overlay = document.getElementById('enlarge-overlay');
            const img = document.getElementById('enlarge-img');
            overlay.style.display = 'block';
            getFullImageBlobUrl(fileId).then(url => { img.src = url; });
        }
        document.getElementById('enlarge-overlay').onclick = function() { this.style.display = 'none'; };

        // ---------- List view ----------
        function renderList() {
            const listDiv = document.getElementById('list-view');
            listDiv.innerHTML = '';

            // Show every country in the world, not just owned ones, so the
            // "None yet" filter has something to display - owned countries
            // sort to the top, everything else follows alphabetically.
            const entries = Object.keys(COUNTRY_NAME_LOOKUP).map(code => ({
                code,
                name: COUNTRY_NAME_LOOKUP[code],
                owned: collectionData.hasOwnProperty(code),
                count: collectionData[code] ? collectionData[code].count : 0
            }));
            entries.sort((a, b) => {
                if (a.owned !== b.owned) return a.owned ? -1 : 1;
                return a.name.localeCompare(b.name);
            });

            entries.forEach(entry => {
                const item = document.createElement('div');
                item.className = 'country-item';
                item.dataset.code = entry.code;
                item.dataset.name = entry.name.toLowerCase();
                if (!entry.owned) item.style.opacity = '0.5';
                item.innerHTML = `<span>${entry.name}</span><span class="count">${entry.owned ? entry.count : ''}</span>`;
                if (entry.owned) item.onclick = () => openModal(entry.code);
                listDiv.appendChild(item);
            });
        }

        // ---------- View toggle, search, filters (unified logic) ----------
        const MAP_ICON_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>';
        const LIST_ICON_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>';

        function initCollectionViewUI() {
            const viewToggleBtn = document.getElementById('view-toggle-btn');
            const listDiv = document.getElementById('list-view');
            const mapDiv = document.getElementById('map');

            function renderViewToggle() {
                const showMap = currentView === 'map';
                mapDiv.style.display = showMap ? 'block' : 'none'; // hiding #map also hides the frame/compass layers on it
                listDiv.style.display = showMap ? 'none' : 'block';
                document.getElementById('toggle-names-btn').style.display = showMap ? 'flex' : 'none'; // map-only control
                if (showMap) {
                    viewToggleBtn.innerHTML = MAP_ICON_SVG; // shows current mode icon; click switches to the other
                    viewToggleBtn.title = 'Switch to List view';
                } else {
                    viewToggleBtn.innerHTML = LIST_ICON_SVG;
                    viewToggleBtn.title = 'Switch to Map view';
                }
            }
            viewToggleBtn.onclick = () => {
                currentView = currentView === 'map' ? 'list' : 'map';
                renderViewToggle();
            };
            renderViewToggle();

            const searchBox = document.getElementById('search-box');
            const searchGhost = document.getElementById('search-ghost');
            searchBox.value = '';
            searchGhost.value = '';

            function matchesQuery(code, name, query) {
                return name.toLowerCase().includes(query) || code.toLowerCase().includes(query);
            }
            function updateGhostSuggestion() {
                const typed = searchBox.value;
                if (typed === '') { searchGhost.value = ''; return; }
                const typedLower = typed.toLowerCase();
                const allNames = Object.values(COUNTRY_NAME_LOOKUP);
                const suggestion = allNames.find(n => n.toLowerCase().startsWith(typedLower));
                searchGhost.value = suggestion ? typed + suggestion.slice(typed.length) : '';
            }
            // Category coloring only applies when NOT actively searching -
            // that way search always works regardless of the current colorMode.
            function passesFilters(code, name) {
                const query = searchBox.value.trim().toLowerCase();
                const searchOk = query === '' || matchesQuery(code, name, query);
                if (!searchOk) return false;
                if (query !== '') return true;
                const isOwned = collectionData.hasOwnProperty(code);
                if (colorMode === 'owned') return isOwned;
                if (colorMode === 'none') return !isOwned;
                return true; // 'both'
            }
            window._passesFilters = passesFilters;

            function applyFilters() {
                const matched = [];
                Object.entries(countryLayers).forEach(([code, layers]) => {
                    const name = COUNTRY_NAME_LOOKUP[code] || code;
                    const isOwned = collectionData.hasOwnProperty(code);
                    const show = passesFilters(code, name);
                    layers.forEach(layer => {
                        layer.setStyle(show
                            ? { fillColor: isOwned ? OWNED_COLOR : NONE_COLOR, fillOpacity: 0.65 }
                            : { fillColor: MUTED_COLOR, fillOpacity: 0.18 });
                    });
                    if (show) matched.push(code);
                });
                document.querySelectorAll('.country-item').forEach(item => {
                    item.style.display = passesFilters(item.dataset.code, item.dataset.name) ? 'flex' : 'none';
                });
                refreshLabels2D();
                return matched;
            }
            window._applyFilters = applyFilters;

            // Rebuilds each country's tooltip as permanent (a visible
            // label) or hover-only, based on the "Show country names"
            // toggle combined with the current search/color mode.
            function refreshLabels2D() {
                Object.entries(countryLayers).forEach(([code, layers]) => {
                    const name = COUNTRY_NAME_LOOKUP[code] || code;
                    const shouldShow = showNamesEnabled && passesFilters(code, name);
                    layers.forEach(layer => {
                        if (layer.getTooltip()) layer.unbindTooltip();
                        // className is applied either way so hover-only tooltips get the
                        // same transparent/themed look instead of Leaflet's default white bubble.
                        layer.bindTooltip(name, { permanent: shouldShow, direction: 'center', className: 'country-label' });
                    });
                });
            }

            document.getElementById('toggle-names-btn').onclick = () => {
                showNamesEnabled = !showNamesEnabled;
                document.getElementById('toggle-names-btn').classList.toggle('active', showNamesEnabled);
                refreshLabels2D();
            };

            function focusOnMatches(matched) {
                if (matched.length === 0 || !leafletMap) return;
                const allLayers = matched.flatMap(c => countryLayers[c]);
                if (allLayers.length === 1) {
                    leafletMap.fitBounds(allLayers[0].getBounds(), { maxZoom: 7, padding: [40, 40] });
                } else {
                    leafletMap.fitBounds(L.featureGroup(allLayers).getBounds(), { maxZoom: 6, padding: [40, 40] });
                }
            }

            searchBox.oninput = () => {
                updateGhostSuggestion();
                const matched = applyFilters();
                if (searchBox.value.trim() !== '' && matched.length === 1) focusOnMatches(matched);
            };
            searchBox.onkeydown = (e) => {
                if ((e.key === 'Tab' || e.key === 'ArrowRight') && searchGhost.value && searchBox.selectionStart === searchBox.value.length) {
                    e.preventDefault();
                    searchBox.value = searchGhost.value;
                    searchGhost.value = '';
                    focusOnMatches(applyFilters());
                } else if (e.key === 'Enter') {
                    focusOnMatches(applyFilters());
                }
            };

            // Single button cycling through 3 coloring modes (the old
            // "neither/Off" state was removed - default is now 'both', so
            // the map always shows something on load, never all-grey).
            const COLOR_MODES = [
                { key: 'both', label: 'Coloring: Have items + None yet', color: 'linear-gradient(90deg, var(--accent-owned), var(--accent-none))' },
                { key: 'owned', label: 'Coloring: Have items', color: 'var(--accent-owned)' },
                { key: 'none', label: 'Coloring: None yet', color: 'var(--accent-none)' },
            ];
            function renderColorModeButton() {
                const mode = COLOR_MODES.find(m => m.key === colorMode);
                const btn = document.getElementById('color-mode-btn');
                document.getElementById('color-mode-label').textContent = mode.label;
                document.getElementById('color-mode-dot').style.background = mode.color;
                btn.title = mode.label; // icon-only button now - full text lives in the tooltip
            }
            document.getElementById('color-mode-btn').onclick = () => {
                const idx = COLOR_MODES.findIndex(m => m.key === colorMode);
                colorMode = COLOR_MODES[(idx + 1) % COLOR_MODES.length].key;
                renderColorModeButton();
                applyFilters();
            };
            renderColorModeButton();

            document.getElementById('reset-btn').onclick = () => {
                searchBox.value = ''; searchGhost.value = '';
                colorMode = 'both';
                renderColorModeButton();
                applyFilters();
                if (leafletMap) leafletMap.setView([20, 10], 2);
            };
        }

        // ---------- Shared geo helpers (used by both the 2D map and the 3D globe) ----------
        const NAME_TO_CODE_OVERRIDE = { 'France': 'FRA', 'Norway': 'NOR', 'Somaliland': 'SLD' };
        function getCodeForFeature(feature) {
            const rawCode = feature.properties['ISO3166-1-Alpha-3'];
            const name = feature.properties['name'];
            return (rawCode && rawCode !== '-99') ? rawCode : (NAME_TO_CODE_OVERRIDE[name] || rawCode);
        }
        function bboxArea(geometry) {
            let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
            (function walk(coords) {
                if (typeof coords[0] === 'number') {
                    const [lng, lat] = coords;
                    if (lat < minLat) minLat = lat; if (lat > maxLat) maxLat = lat;
                    if (lng < minLng) minLng = lng; if (lng > maxLng) maxLng = lng;
                } else { coords.forEach(walk); }
            })(geometry.coordinates);
            return (maxLat - minLat) * (maxLng - minLng);
        }
        const MIN_VISIBLE_AREA = 0.3;
        const ALWAYS_VISIBLE_CODES = new Set(['PSE']); // exempted from the small-territory filter below
        function featureFilter(feature) {
            const code = getCodeForFeature(feature);
            if (collectionData.hasOwnProperty(code)) return true;
            if (ALWAYS_VISIBLE_CODES.has(code)) return true;
            return bboxArea(feature.geometry) >= MIN_VISIBLE_AREA;
        }

        // Fetches the world boundaries ONCE and reuses that same array
        // every time the map is (re)built. The file itself is pre-
        // simplified (via Mapshaper, topology-aware - shared borders stay
        // identical between neighboring countries) and hosted right
        // alongside this page, so there's no external dependency.
        let cachedGeoFeatures = null;
        async function getGeoFeatures() {
            if (cachedGeoFeatures) return cachedGeoFeatures;
            const geoData = await fetch('countries.geojson').then(r => r.json());
            cachedGeoFeatures = geoData.features.filter(featureFilter);
            return cachedGeoFeatures;
        }

        // Decorative antique-map compass rose. Added to the map with
        // L.svgOverlay (bound to a real lat/lng box, see initMap) rather than
        // a fixed-pixel marker/divIcon, specifically so it scales up and down
        // together with the map when zooming instead of staying a constant
        // screen size - it's meant to look like it's printed on the map
        // itself, the way a real antique map's compass rose is.
        const COMPASS_ROSE_SVG = `<svg class="compass-rose-overlay" viewBox="-10 -10 220 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="100" cy="100" r="101" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
            <circle cx="100" cy="100" r="80" fill="none" stroke="currentColor" stroke-width="0.7" opacity="0.35"/>
            <g stroke="currentColor" stroke-width="1" opacity="0.5">
                <line x1="123.3" y1="13.1" x2="125.4" y2="5.3"/><line x1="145.0" y1="22.1" x2="150.0" y2="13.4"/><line x1="177.9" y1="55.0" x2="186.6" y2="50.0"/><line x1="186.9" y1="76.7" x2="194.7" y2="74.6"/><line x1="186.9" y1="123.3" x2="194.7" y2="125.4"/><line x1="177.9" y1="145.0" x2="186.6" y2="150.0"/><line x1="145.0" y1="177.9" x2="150.0" y2="186.6"/><line x1="123.3" y1="186.9" x2="125.4" y2="194.7"/><line x1="76.7" y1="186.9" x2="74.6" y2="194.7"/><line x1="55.0" y1="177.9" x2="50.0" y2="186.6"/><line x1="22.1" y1="145.0" x2="13.4" y2="150.0"/><line x1="13.1" y1="123.3" x2="5.3" y2="125.4"/><line x1="13.1" y1="76.7" x2="5.3" y2="74.6"/><line x1="22.1" y1="55.0" x2="13.4" y2="50.0"/><line x1="55.0" y1="22.1" x2="50.0" y2="13.4"/><line x1="76.7" y1="13.1" x2="74.6" y2="5.3"/>
            </g>
            <polygon points="138.9,61.1 122.0,100.0 138.9,138.9 100.0,122.0 61.1,138.9 78.0,100.0 61.1,61.1 100.0,78.0" fill="currentColor" opacity="0.3"/>
            <polygon points="100.0,12.0 115.6,84.4 188.0,100.0 115.6,115.6 100.0,188.0 84.4,115.6 12.0,100.0 84.4,84.4" fill="currentColor" opacity="0.75"/>
            <circle cx="100" cy="100" r="5" fill="currentColor" opacity="0.9"/>
            <text x="100" y="-4" text-anchor="middle" dominant-baseline="central" font-size="22" font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="currentColor" opacity="0.9">N</text>
            <text x="204" y="100" text-anchor="middle" dominant-baseline="central" font-size="22" font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="currentColor" opacity="0.9">E</text>
            <text x="100" y="204" text-anchor="middle" dominant-baseline="central" font-size="22" font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="currentColor" opacity="0.9">S</text>
            <text x="-4" y="100" text-anchor="middle" dominant-baseline="central" font-size="22" font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="currentColor" opacity="0.9">W</text>
        </svg>`;

        function seededRandom(seed) {
            let s = seed % 2147483647;
            if (s <= 0) s += 2147483646;
            return function() {
                s = (s * 16807) % 2147483647;
                return (s - 1) / 2147483646;
            };
        }

        // Builds a hand-torn-parchment-edge outline as a closed lat/lng loop:
        // a rectangle whose four sides are jittered along their perpendicular
        // axis (seeded, so the shape is stable across reloads) so the border
        // reads as the deckled edge of an old paper map instead of a ruled
        // rectangle. Kept well clear of the poles: Leaflet's default
        // projection can't represent latitude +/-90, and a frame that reached
        // that far used to draw a stray straight line across the whole width
        // of the map right through the Arctic and Antarctica.
        function buildTornFrame(latMin, latMax, lonMin, lonMax, jitterLat, jitterLon, segsPerSide, seed) {
            const rand = seededRandom(seed);
            const j = (amt) => (rand() - 0.5) * 2 * amt;
            const pts = [];
            for (let i = 0; i <= segsPerSide; i++) {
                const t = i / segsPerSide;
                pts.push([latMax + j(jitterLat), lonMin + (lonMax - lonMin) * t]);
            }
            for (let i = 1; i <= segsPerSide; i++) {
                const t = i / segsPerSide;
                pts.push([latMax - (latMax - latMin) * t, lonMax + j(jitterLon)]);
            }
            for (let i = 1; i <= segsPerSide; i++) {
                const t = i / segsPerSide;
                pts.push([latMin + j(jitterLat), lonMax - (lonMax - lonMin) * t]);
            }
            for (let i = 1; i <= segsPerSide; i++) {
                const t = i / segsPerSide;
                pts.push([latMin + (latMax - latMin) * t, lonMin + j(jitterLon)]);
            }
            return pts;
        }

        async function initMap() {
            countryLayers = {};
            COUNTRY_NAME_LOOKUP = {};

            leafletMap = L.map('map', {
                preferCanvas: true,
                worldCopyJump: false,
                // Longitude range is shifted from the standard [-180,180] to
                // [-169,191] - the world "wraps" at the Bering Strait (open
                // water) instead of at the antimeridian, which used to cut
                // straight through Russia (see countries.geojson prep notes).
                maxBounds: [[-90, -169], [90, 191]],
                maxBoundsViscosity: 1.0,
                minZoom: 1,
                zoomControl: false
            }).setView([20, 10], 2);

            const features = await getGeoFeatures();

            function onEachCountry(feature, layer) {
                const code = getCodeForFeature(feature);
                const name = feature.properties['name'];
                const info = collectionData[code];
                if (!countryLayers[code]) countryLayers[code] = [];
                countryLayers[code].push(layer);
                COUNTRY_NAME_LOOKUP[code] = name;

                layer.bindTooltip(name, { direction: 'center', className: 'country-label' }); // hover-only by default; refreshLabels2D() controls the permanent state
                if (info) {
                    layer.on('click', () => openModal(code));
                    layer.on('mouseover', function() { if (window._passesFilters(code, name)) this.setStyle({ fillOpacity: 0.9 }); });
                    layer.on('mouseout', function() { if (window._passesFilters(code, name)) this.setStyle({ fillOpacity: 0.65 }); });
                }
            }

            L.geoJSON({ type: 'FeatureCollection', features }, {
                style: { weight: 0.6, color: BORDER_COLOR, fillColor: MUTED_COLOR, fillOpacity: 0.1 },
                onEachFeature: onEachCountry
            }).addTo(leafletMap);

            // Antique-map dressing, anchored in map space (lat/lng), not
            // screen space, so both pan and zoom together with the map:
            // - a double torn-parchment-edge frame near the world's edge
            //   (kept well short of the poles - see buildTornFrame's comment)
            // - a compass rose sitting in open ocean west of South America,
            //   as a real SVG overlay so it scales with the map
            const outerFrame = buildTornFrame(-78, 80, -168, 190, 1.6, 2.4, 48, 101);
            const innerFrame = buildTornFrame(-74, 76, -164, 186, 1.3, 2.0, 48, 202);
            L.polygon(outerFrame, {
                interactive: false, fill: false, color: BORDER_COLOR, weight: 2.2, opacity: 0.65, lineJoin: 'round'
            }).addTo(leafletMap);
            L.polygon(innerFrame, {
                interactive: false, fill: false, color: BORDER_COLOR, weight: 1, opacity: 0.4, lineJoin: 'round'
            }).addTo(leafletMap);
            const compassSvgEl = new DOMParser().parseFromString(COMPASS_ROSE_SVG, 'image/svg+xml').documentElement;
            L.svgOverlay(compassSvgEl, [[-30, -110], [-10, -90]], {
                interactive: false, className: 'compass-rose-overlay'
            }).addTo(leafletMap);

            // Applies the current coloring mode (default: none shown at
            // all) instead of always revealing colors on load.
            window._applyFilters();
        }

        // ---------- Step 7: opening a collection ----------
        // Fetches every country folder AND the images inside each one,
        // directly from the browser - no server involved at all.
        async function fetchCollectionData(rootFolderId) {
            const foldersResp = await gapi.client.drive.files.list({
                q: `'${rootFolderId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`,
                fields: 'files(id, name)',
                pageSize: 1000
            });
            const folders = foldersResp.result.files;

            const countries = [];
            for (const folder of folders) {
                const imagesResp = await gapi.client.drive.files.list({
                    q: `'${folder.id}' in parents and mimeType contains 'image/' and trashed=false`,
                    fields: 'files(id, name)',
                    pageSize: 1000
                });
                countries.push({ code: folder.name, images: imagesResp.result.files });
            }
            return countries;
        }

        async function openCollection(col) {
            contentEl.innerHTML = `<p>Opening "${col.name}"...</p>`;
            setStatus('Reading folders and images...');
            getDriveThumbIndex(); // warm this up now (don't await) so it's already
                                   // resolved by the time the first photo thumbnail
                                   // is requested, instead of adding a round trip then

            try {
                const countries = await fetchCollectionData(col.id);
                setStatus('');
                await showCollectionView(col, countries);
            } catch (err) {
                console.error(err);
                contentEl.innerHTML = `<p style="color:#f43f5e;">Error: ${err.message || JSON.stringify(err)}</p>`;
            }
        }
    </script>
</body>
</html>
