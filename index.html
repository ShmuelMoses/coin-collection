<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Collections</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        /* Antique/parchment palette - the app's only theme now (the
           futuristic dark theme + toggle button were removed by request). */
        :root {
            --bg-solid: #ece2c8;
            --bg-translucent: rgba(236, 226, 200, 0.88);
            --panel-alt: #ddcda3;
            --accent-owned: #4b6b3a;
            --accent-none: #a13d2b;
            --muted: #a89a78;
            --text: #3b2a1a;
            --text-dim: rgba(59,42,26,0.55);
            --border: rgba(59,42,26,0.25);
            --map-bg: #e3d5ae;
            --label-halo: rgba(236,226,200,0.95);
        }
        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: var(--bg-solid);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: var(--panel-alt);
            padding: 30px 40px;
            border-radius: 12px;
            width: 360px;
            text-align: center;
            border: 1px solid var(--border);
        }
        h1 { font-size: 20px; margin-bottom: 20px; }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 6px;
            border: none;
            font-size: 15px;
            cursor: pointer;
        }
        .primary-btn { background: var(--accent-owned); color: var(--bg-solid); font-weight: bold; }
        .collection-item {
            background: var(--bg-solid);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .collection-item:hover { border-color: var(--accent-owned); }
        .delete-collection-btn {
            width: auto; margin: 0; padding: 4px 8px; background: transparent;
            border: 1px solid transparent; color: var(--text-dim); font-size: 15px; border-radius: 6px;
        }
        .delete-collection-btn:hover { background: rgba(255,255,255,0.08); color: #94a3b8; }
        #status { font-size: 13px; color: #94a3b8; margin-top: 16px; }

        /* ===== Collection view (map/list/search/modal) ===== */
        #collection-view { display: flex; height: 100vh; width: 100vw; position: fixed; top:0; left:0; }
        /* Desktop: the sidebar is a floating card over the map (not a full-height
           column) - it takes itself out of the flex layout via position:absolute,
           so #cv-main automatically expands to fill the whole viewport underneath
           it. Height is automatic, based on its own content (how many buttons/
           rows it has), capped so it never runs off the bottom of a short window. */
        #cv-sidebar {
            position: absolute; top: 20px; left: 20px; z-index: 500;
            width: 230px; max-height: calc(100vh - 40px); overflow-y: auto;
            background: var(--bg-translucent); backdrop-filter: blur(6px); color: var(--text);
            padding: 20px; border: 1px solid var(--border); border-radius: 10px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.35);
        }
        #back-btn {
            width: 100%; background: transparent; border: 1px solid var(--border); color: var(--text-dim);
            padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 24px;
        }
        #app-version { text-align: center; font-size: 10px; color: var(--text-dim); opacity: 0.6; margin-top: 8px; }
        .app-version { text-align: center; font-size: 10px; color: var(--text-dim); opacity: 0.6; margin-top: 16px; }
        #cv-title { font-size: 24px; margin: 0 0 16px 0; color: var(--accent-owned); text-align: center; }

        /* Phones: sidebar becomes a compact bar across the TOP instead of a
           floating card, so it blocks as little of the map as possible */
        @media (max-width: 700px) {
            #collection-view { flex-direction: column; }
            #cv-sidebar {
                position: static; top: auto; left: auto; max-height: none;
                box-shadow: none; border-radius: 0; backdrop-filter: none;
                background: var(--bg-solid);
                width: 100%; height: auto;
                border: none; border-bottom: 1px solid var(--border);
                display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
                padding: 8px 10px;
            }
            #cv-title { font-size: 16px; margin: 0 8px 0 0; flex-shrink: 0; }
            #icon-row { margin-bottom: 0; gap: 6px; }
            .icon-btn { width: 30px; height: 30px; font-size: 14px; }
            .search-wrap { margin-bottom: 0; flex: 1 1 140px; min-width: 100px; }
            #search-box, #search-ghost { font-size: 12px; padding: 6px 8px; }
            #toggle-names-btn { display: none !important; } /* map-only, low priority on a small screen */
            .legend-btn { font-size: 11px; padding: 6px 8px; margin-bottom: 0; width: auto; }
            #back-btn { font-size: 11px; padding: 6px 8px; width: auto; margin-top: 0; }
            .box { max-width: 92vw; padding: 24px 20px; }
        }
        .search-wrap { position: relative; margin-bottom: 16px; }
        #search-box, #search-ghost {
            width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
            font-size: 14px; background: transparent; color: var(--text);
        }
        #search-box { position: relative; z-index: 2; }
        #search-ghost { position: absolute; top: 0; left: 0; background: var(--panel-alt); color: var(--text-dim); pointer-events: none; z-index: 1; }
        .legend-btn {
            display: flex; align-items: center; gap: 8px; width: 100%; background: var(--panel-alt);
            border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 6px;
            cursor: pointer; font-size: 13px; margin-bottom: 8px;
        }
        .legend-btn.active { border-color: currentColor; background: rgba(255,255,255,0.08); }
        .legend-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
        #icon-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
        .icon-btn {
            width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            background: var(--panel-alt); border: 1px solid var(--border); border-radius: 6px; color: var(--text);
            cursor: pointer; padding: 0; font-size: 16px; line-height: 1;
        }
        .icon-btn:hover { border-color: var(--accent-owned); }
        .icon-btn.active { border-color: var(--accent-owned); background: rgba(0,0,0,0.08); }
        #cv-main { flex: 1; position: relative; transition: filter 0.2s; }
        #cv-main.dimmed { filter: brightness(0.55); }
        #map { height: 100%; width: 100%; background: var(--map-bg); }
        /* Decorative antique-map dressing (compass rose + torn-parchment frame)
           is added as real Leaflet layers anchored to lat/lng in initMap(), so
           it pans AND zooms together with the map like part of the paper
           itself - see buildTornFrame() and the L.svgOverlay call in JS. The
           compass rose is an SVG overlay (not a fixed-pixel marker/divIcon)
           specifically so it scales with the map instead of staying a
           constant screen size while zooming. */
        .compass-rose-overlay { color: var(--text); opacity: 0.6; pointer-events: none; }
        .country-label {
            background: transparent; border: none; box-shadow: none; font-size: 11px; font-weight: bold;
            color: var(--text); text-shadow: 0 0 3px var(--label-halo), 0 0 3px var(--label-halo);
        }
        .country-label::before { display: none; } /* hide Leaflet's default tooltip arrow/wedge */
        .leaflet-container path:focus { outline: none; }
        /* Zoom is available via scroll/pinch already - the +/- buttons are
           redundant clutter, so they're hidden everywhere */
        .leaflet-control-zoom { display: none !important; }
        #list-view {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow-y: auto; padding: 20px; background: var(--bg-translucent); z-index: 400;
        }
        .country-item {
            background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 8px;
            padding: 12px 16px; margin-bottom: 10px; cursor: pointer; display: flex;
            justify-content: space-between; align-items: center; color: var(--text);
        }
        .country-item:hover { background: rgba(34,211,238,0.15); border-color: var(--accent-owned); }
        .country-item .count { color: var(--accent-owned); font-weight: bold; }
        #modal-backdrop { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: transparent; z-index: 1000; }
        #modal {
            display: none; position: fixed; top: 8%; left: 50%; transform: translateX(-50%);
            width: fit-content; max-width: 90%; max-height: 80%; overflow-y: auto;
            background: var(--bg-translucent); backdrop-filter: blur(6px); color: var(--text);
            border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 4px 30px rgba(0,0,0,0.6);
            z-index: 1001; padding: 20px;
        }
        #modal h2 { margin: 0; color: var(--accent-owned); line-height: 1.2; }
        #modal-header {
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
            gap: 6px; margin-bottom: 18px;
        }
        #modal-header h2 { text-align: center; white-space: nowrap; }
        .modal-header-side { display: flex; align-items: center; gap: 10px; min-height: 24px; }
        .modal-header-left { justify-content: flex-start; }
        .modal-header-right { justify-content: flex-end; }
        #share-icon-btn, #share-confirm-icon-btn, #share-cancel-icon-btn,
        #organize-icon-btn, #organize-confirm-icon-btn, #organize-cancel-icon-btn {
            width: auto; padding: 0; margin: 0; background: transparent; border: none;
            color: var(--accent-owned); cursor: pointer; display: flex; align-items: center;
        }
        #share-cancel-icon-btn, #organize-cancel-icon-btn { color: var(--accent-none); }
        #organize-icon-btn { color: var(--text-dim); }
        #share-icon-btn:hover, #share-confirm-icon-btn:hover,
        #organize-icon-btn:hover, #organize-confirm-icon-btn:hover { opacity: 0.75; }
        #modal-images { display: block; }
        #modal-images img {
            width: 130px; height: 130px; object-fit: contain; background: rgba(255,255,255,0.06);
            border-radius: 6px; border: 1px solid var(--border); cursor: pointer; padding: 4px;
            display: block; transition: opacity 0.15s ease;
        }
        /* Shown over a thumbnail while its image is still downloading -
           Drive has to serve the full-res file first (see fetchFullImageBlob),
           which can take a while for a country with many/large photos. */
        .thumb-spinner {
            position: absolute; top: 50%; left: 50%; width: 22px; height: 22px;
            margin: -11px 0 0 -11px; border: 2px solid var(--border); border-top-color: var(--accent-owned);
            border-radius: 50%; animation: thumb-spin 0.8s linear infinite; pointer-events: none;
        }
        @keyframes thumb-spin { to { transform: rotate(360deg); } }
        #enlarge-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; text-align: center;
        }
        #enlarge-overlay img { max-width: 90%; max-height: 90%; margin-top: 5vh; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="box" id="login-box">
        <h1 id="title">My Collections</h1>
        <div id="content">
            <button id="signin-btn" class="primary-btn" disabled>Loading...</button>
        </div>
        <div id="status"></div>
        <div class="app-version">v1.2</div>
    </div>

    <!-- ===== Full collection view (map / list / search / modal) ===== -->
    <div id="collection-view" style="display:none;">
        <div id="cv-sidebar">
            <h1 id="cv-title"></h1>
            <div id="icon-row">
                <button id="view-toggle-btn" class="icon-btn" title="Switch to List view"></button>
                <button id="color-mode-btn" class="icon-btn" title="Coloring: Have items + None yet">
                    <span class="legend-dot" id="color-mode-dot" style="background:linear-gradient(90deg, var(--accent-owned), var(--accent-none));"></span>
                    <span id="color-mode-label" style="display:none;"></span>
                </button>
                <button id="toggle-names-btn" class="icon-btn" title="Show country names">N</button>
                <button id="reset-btn" class="icon-btn" title="Reset view">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
                </button>
            </div>
            <div class="search-wrap">
                <input type="text" id="search-ghost" tabindex="-1" disabled>
                <input type="text" id="search-box" placeholder="Search" autocomplete="off">
            </div>
            <button id="back-btn">&larr; My Collections</button>
            <div id="app-version">v1.2</div>
        </div>
        <div id="cv-main">
            <div id="map"></div>
            <div id="list-view"></div>
        </div>
        <div id="modal-backdrop"></div>
        <div id="modal">
            <div id="modal-header">
                <div class="modal-header-side modal-header-left">
                    <button id="organize-icon-btn" title="Organize into categories">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                    </button>
                    <button id="organize-confirm-icon-btn" title="Save changes" style="display:none;">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg>
                    </button>
                    <button id="organize-cancel-icon-btn" title="Discard changes" style="display:none;">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
                    </button>
                </div>
                <h2 id="modal-title"></h2>
                <div class="modal-header-side modal-header-right">
                    <button id="share-cancel-icon-btn" title="Cancel" style="display:none;">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
                    </button>
                    <button id="share-icon-btn" title="Share this country">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 9 Q6 4 9.5 8 Q12 5 14.5 8 Q17 4 21 9"/>
                            <rect x="7" y="13" width="10" height="7" rx="0.8"/>
                            <path d="M7 13.3 12 17 17 13.3"/>
                        </svg>
                    </button>
                    <button id="share-confirm-icon-btn" title="Share selected" style="display:none;">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg>
                    </button>
                </div>
            </div>
            <div id="modal-images"></div>
        </div>
        <div id="enlarge-overlay">
            <img id="enlarge-img" src="">
        </div>
    </div>

    <script>
        // ==== FILL THESE IN ====
        const CLIENT_ID = '252654816217-o1aq4hj15j9mpb3ldtor3dpq8r3ruk6h.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyAJr_VFFCgezqt0si7LvoZSdCqkuMonFPk';
        // ========================

        const SCOPES = 'https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.appdata';
        const COLLECTIONS_FILENAME = 'collections.json';

        let tokenClient;
        let accessToken = null;
        let gapiReady = false;

        const statusEl = document.getElementById('status');
        const contentEl = document.getElementById('content');

        function setStatus(msg) { statusEl.textContent = msg; }

        // ---------- Step 1: load the Google API client (for Drive + Picker) ----------
        function loadGapiClient() {
            gapi.load('client:picker', async () => {
                try {
                    await gapi.client.init({ apiKey: API_KEY });
                    await gapi.client.load('https://www.googleapis.com/discovery/v1/apis/drive/v3/rest');
                    gapiReady = true;

                    const btn = document.getElementById('signin-btn');
                    btn.disabled = false;
                    btn.textContent = 'Sign in with Google';

                    // Set up the token client once, then try a SILENT sign-in
                    // first (prompt:''). If you've already granted access
                    // before and still have an active Google session in this
                    // browser, this logs you back in automatically with no
                    // click needed - only falling back to the visible button
                    // if that silent attempt doesn't produce a token.
                    tokenClient = google.accounts.oauth2.initTokenClient({
                        client_id: CLIENT_ID,
                        scope: SCOPES,
                        callback: handleTokenResponse,
                    });
                    tokenClient.requestAccessToken({ prompt: '' });
                } catch (err) {
                    console.error(err);
                    setStatus('Failed to load Google API: ' + (err.message || JSON.stringify(err)));
                }
            });
        }
        window.onload = loadGapiClient;

        async function handleTokenResponse(response) {
            if (!response.access_token) {
                return; // silent attempt found no existing session - just wait for the button
            }
            accessToken = response.access_token;
            gapi.client.setToken({ access_token: accessToken });
            setStatus('Loading your collections...');
            try {
                await showCollectionsScreen();
            } catch (err) {
                console.error(err);
                setStatus('Error: ' + (err.message || JSON.stringify(err)));
            }
        }

        // ---------- Step 2: sign in with Google (gets an access token) ----------
        document.getElementById('signin-btn').onclick = () => {
            tokenClient.requestAccessToken();
        };

        // ---------- Step 3: read the saved collections list from Drive's
        // hidden "appDataFolder" (a private space only this app can see) ----------
        async function loadCollections() {
            const listResp = await gapi.client.drive.files.list({
                spaces: 'appDataFolder',
                q: `name='${COLLECTIONS_FILENAME}'`,
                fields: 'files(id, name)'
            });
            const files = listResp.result.files;
            if (files.length === 0) return { fileId: null, collections: [] };

            const fileId = files[0].id;
            const contentResp = await gapi.client.drive.files.get({ fileId, alt: 'media' });
            const collections = JSON.parse(contentResp.body || '[]');
            return { fileId, collections };
        }

        // ---------- Step 4: save the collections list back to appDataFolder ----------
        async function saveCollections(fileId, collections) {
            const content = JSON.stringify(collections);
            const boundary = '-------314159265358979323846';
            const metadata = { name: COLLECTIONS_FILENAME, mimeType: 'application/json' };
            if (!fileId) metadata.parents = ['appDataFolder'];

            const multipartBody =
                `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(metadata)}\r\n` +
                `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;

            const path = fileId
                ? `/upload/drive/v3/files/${fileId}?uploadType=multipart`
                : `/upload/drive/v3/files?uploadType=multipart`;

            const resp = await gapi.client.request({
                path,
                method: fileId ? 'PATCH' : 'POST',
                headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
                body: multipartBody
            });
            return resp.result.id;
        }

        // ---------- Step 5: render the "choose / create collection" screen ----------
        async function showCollectionsScreen() {
            const { fileId, collections } = await loadCollections();
            window._collectionsState = { fileId, collections }; // stashed for the add-flow below
            setStatus('');

            if (collections.length === 0) {
                contentEl.innerHTML = `<p style="font-size:14px;color:#94a3b8;">You don't have any collections yet.</p>`;
                const btn = document.createElement('button');
                btn.className = 'primary-btn';
                btn.textContent = '+ Create your first collection';
                btn.onclick = addNewCollection;
                contentEl.appendChild(btn);
                return;
            }

            contentEl.innerHTML = '';
            collections.forEach((col, idx) => {
                const item = document.createElement('div');
                item.className = 'collection-item';
                item.onclick = () => openCollection(col);

                const nameSpan = document.createElement('span');
                nameSpan.textContent = col.name;
                nameSpan.style.flex = '1';
                item.appendChild(nameSpan);

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-collection-btn';
                delBtn.innerHTML = '&#128465;'; // grey trash can icon
                delBtn.title = 'Remove this collection';
                delBtn.onclick = (e) => { e.stopPropagation(); deleteCollection(col, fileId, collections, idx); };
                item.appendChild(delBtn);

                contentEl.appendChild(item);
            });
            const addBtn = document.createElement('button');
            addBtn.className = 'primary-btn';
            addBtn.textContent = '+ Add new collection';
            addBtn.onclick = addNewCollection;
            contentEl.appendChild(addBtn);
        }

        async function deleteCollection(col, fileId, collections, idx) {
            const confirmed = confirm(
                `Remove "${col.name}" from your collections list?\n\n` +
                `This only removes it from this app - the folder and all photos ` +
                `stay exactly as they are in your Google Drive.`
            );
            if (!confirmed) return;

            const updated = collections.slice();
            updated.splice(idx, 1); // remove exactly this one entry, by position
            setStatus('Removing...');
            const newFileId = await saveCollections(fileId, updated);
            window._collectionsState = { fileId: newFileId, collections: updated };
            await showCollectionsScreen();
        }

        // ---------- Step 6: "Add new collection" - opens the Google Picker
        // so the user selects a folder from their own Drive ----------
        function addNewCollection() {
            const picker = new google.picker.PickerBuilder()
                .addView(new google.picker.DocsView(google.picker.ViewId.FOLDERS)
                    .setSelectFolderEnabled(true)
                    .setIncludeFolders(true))
                .setOAuthToken(accessToken)
                .setDeveloperKey(API_KEY)
                .setCallback(pickerCallback)
                .build();
            picker.setVisible(true);
        }

        async function pickerCallback(data) {
            if (data.action !== google.picker.Action.PICKED) return;

            const folder = data.docs[0];
            const displayName = prompt('Name this collection:', folder.name) || folder.name;

            const { fileId, collections } = window._collectionsState;
            collections.push({ id: folder.id, name: displayName });

            setStatus('Saving...');
            const newFileId = await saveCollections(fileId, collections);
            window._collectionsState = { fileId: newFileId, collections };

            await showCollectionsScreen();
        }

        // ---------- Image cache (IndexedDB) - the browser-side equivalent
        // of the old "image_cache" folder on disk from the Flask version ----------
        let dbPromise = null;

        // Asks the browser not to auto-evict our cached images under
        // storage pressure. Not guaranteed (especially on Safari), but it
        // meaningfully reduces the chance of the cache being cleared.
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().then(granted => {
                console.log('Persistent storage granted:', granted);
            });
        }

        function getDB() {
            if (dbPromise) return dbPromise;
            dbPromise = new Promise((resolve, reject) => {
                const request = indexedDB.open('coin_collection_cache', 1);
                request.onupgradeneeded = () => {
                    request.result.createObjectStore('images');
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
            return dbPromise;
        }

        async function cacheGet(key) {
            const db = await getDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('images', 'readonly');
                const req = tx.objectStore('images').get(key);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => reject(req.error);
            });
        }

        async function cacheSet(key, blob) {
            const db = await getDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('images', 'readwrite');
                tx.objectStore('images').put(blob, key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function cacheDelete(key) {
            const db = await getDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('images', 'readwrite');
                tx.objectStore('images').delete(key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        // Since Google's fast thumbnailLink CDN blocks browser access (see
        // above), we download the full image once and shrink it ourselves
        // with a canvas - then cache that small version separately, so
        // every viewing after the first is instant with no network at all.
        async function fetchFullImageBlob(fileId) {
            const cacheKey = fileId + '_full';
            const cached = await cacheGet(cacheKey);
            if (cached) {
                if (cached.type && cached.type.startsWith('image/')) return cached;
                // A bad (non-image) response got cached previously - throw
                // it away and fetch fresh instead of failing forever.
                await cacheDelete(cacheKey);
            }

            const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                headers: { Authorization: 'Bearer ' + accessToken }
            });
            if (!resp.ok) {
                const text = await resp.text().catch(() => '');
                throw new Error(`Drive returned ${resp.status} for file ${fileId}: ${text.slice(0, 300)}`);
            }
            const blob = await resp.blob();
            if (!blob.type.startsWith('image/')) {
                const text = await blob.text().catch(() => '');
                throw new Error(`Drive did not return image data for file ${fileId} (got "${blob.type}"): ${text.slice(0, 300)}`);
            }
            await cacheSet(cacheKey, blob);
            return blob;
        }

        function resizeDims(width, height, maxDim) {
            if (width > height) {
                if (width > maxDim) return [maxDim, Math.round(height * maxDim / width)];
            } else {
                if (height > maxDim) return [Math.round(width * maxDim / height), maxDim];
            }
            return [width, height];
        }

        // Shrinks an image blob to a small JPEG. Prefers createImageBitmap
        // with its built-in resize option where available (Chrome/Edge/
        // Firefox) - the browser decodes straight to the target size using
        // its native image pipeline, which is both noticeably faster and
        // sharper than decoding full-res into an <img>/<canvas> and scaling
        // down by hand. Falls back to the old Image+canvas approach on
        // browsers without createImageBitmap resize support (e.g. Safari).
        async function resizeImageBlob(blob, maxDim, quality = 0.86) {
            if (typeof createImageBitmap === 'function') {
                try {
                    const srcBitmap = await createImageBitmap(blob);
                    const [w, h] = resizeDims(srcBitmap.width, srcBitmap.height, maxDim);
                    const resizedBitmap = await createImageBitmap(srcBitmap, {
                        resizeWidth: w, resizeHeight: h, resizeQuality: 'high'
                    });
                    srcBitmap.close();
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(resizedBitmap, 0, 0, w, h);
                    resizedBitmap.close();
                    return await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
                } catch (err) {
                    console.warn('createImageBitmap resize failed, falling back:', err);
                }
            }
            return new Promise((resolve, reject) => {
                const img = new Image();
                const objUrl = URL.createObjectURL(blob);
                img.onload = () => {
                    const [width, height] = resizeDims(img.width, img.height, maxDim);
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    canvas.toBlob(resolve, 'image/jpeg', quality);
                    URL.revokeObjectURL(objUrl);
                };
                img.onerror = () => {
                    reject(new Error(`Could not decode image (blob type="${blob.type}", size=${blob.size} bytes)`));
                };
                img.src = objUrl;
            });
        }

        // ---------- Server-side ("real") thumbnail cache, stored in this
        // app's private Drive appData space -----------------------------
        // The IndexedDB cache above only helps on repeat views from the
        // SAME browser. The first time any photo is viewed anywhere, its
        // thumbnail still has to be produced by downloading the full-res
        // original and shrinking it locally - which is what was slow.
        // To fix that for good, once a thumbnail has been generated we
        // also upload the small JPEG to Drive (in the app's hidden appData
        // folder, alongside layouts.json), named "<fileId>_thumb.jpg". On
        // every later view - from any device, any browser - we check for
        // that small file first and fetch it directly instead of the
        // full-size photo.
        //
        // Note: this uses appDataFolder rather than a folder inside each
        // country's own Drive folder. appData is private to this app and
        // already covered by the existing drive.appdata permission (the
        // same one layouts.json already uses), so no extra Google
        // permission / re-login is required and there's no risk of a
        // thumbnail file being mistaken for one of your photos.
        let driveThumbIndexPromise = null;
        function getDriveThumbIndex() {
            if (driveThumbIndexPromise) return driveThumbIndexPromise;
            driveThumbIndexPromise = (async () => {
                const index = new Map(); // "<fileId>_thumb.jpg" -> Drive fileId of the cached thumb
                let pageToken;
                do {
                    const resp = await gapi.client.drive.files.list({
                        spaces: 'appDataFolder',
                        q: "name contains '_thumb.jpg' and trashed=false",
                        fields: 'nextPageToken, files(id, name)',
                        pageSize: 1000,
                        pageToken
                    });
                    (resp.result.files || []).forEach(f => index.set(f.name, f.id));
                    pageToken = resp.result.nextPageToken;
                } while (pageToken);
                return index;
            })();
            return driveThumbIndexPromise;
        }

        async function fetchDriveThumbBlob(driveThumbId) {
            const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${driveThumbId}?alt=media`, {
                headers: { Authorization: 'Bearer ' + accessToken }
            });
            if (!resp.ok) throw new Error(`Drive returned ${resp.status} fetching cached thumbnail ${driveThumbId}`);
            return resp.blob();
        }

        async function blobToBase64(blob) {
            const buf = await blob.arrayBuffer();
            const bytes = new Uint8Array(buf);
            let binary = '';
            const chunkSize = 0x8000; // avoid blowing the call stack on String.fromCharCode.apply
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        const thumbUploadsInFlight = new Set();
        // Fire-and-forget: never blocks or breaks thumbnail display if it fails
        // (offline, quota, etc.) - it's purely a "make next time faster" step.
        async function uploadThumbnailToDrive(fileId, thumbBlob) {
            const thumbName = fileId + '_thumb.jpg';
            if (thumbUploadsInFlight.has(thumbName)) return;
            thumbUploadsInFlight.add(thumbName);
            try {
                const index = await getDriveThumbIndex();
                if (index.has(thumbName)) return; // already cached (e.g. by another tab/device)
                const base64Data = await blobToBase64(thumbBlob);
                const boundary = '-------314159265358979323846';
                const metadata = { name: thumbName, mimeType: 'image/jpeg', parents: ['appDataFolder'] };
                const multipartBody =
                    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(metadata)}\r\n` +
                    `--${boundary}\r\nContent-Type: image/jpeg\r\nContent-Transfer-Encoding: base64\r\n\r\n${base64Data}\r\n--${boundary}--`;
                const resp = await gapi.client.request({
                    path: '/upload/drive/v3/files?uploadType=multipart',
                    method: 'POST',
                    headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
                    body: multipartBody
                });
                index.set(thumbName, resp.result.id);
            } catch (err) {
                console.warn('Could not cache thumbnail to Drive for', fileId, ':', err);
            } finally {
                thumbUploadsInFlight.delete(thumbName);
            }
        }

        async function getThumbnailBlobUrl(fileId) {
            const cacheKey = fileId + '_thumb';
            const cached = await cacheGet(cacheKey);
            if (cached) return URL.createObjectURL(cached);

            // Check the Drive-side cache before falling back to a full download -
            // a thumbnail generated during any earlier view (this device or
            // another) will already be there.
            try {
                const index = await getDriveThumbIndex();
                const driveThumbId = index.get(fileId + '_thumb.jpg');
                if (driveThumbId) {
                    const thumbBlob = await fetchDriveThumbBlob(driveThumbId);
                    await cacheSet(cacheKey, thumbBlob);
                    return URL.createObjectURL(thumbBlob);
                }
            } catch (err) {
                console.warn('Drive thumbnail lookup failed for', fileId, '- falling back to full image:', err);
            }

            const fullBlob = await fetchFullImageBlob(fileId);
            const thumbBlob = await resizeImageBlob(fullBlob, 320);
            await cacheSet(cacheKey, thumbBlob);
            uploadThumbnailToDrive(fileId, thumbBlob); // don't await - happens in the background
            return URL.createObjectURL(thumbBlob);
        }

        async function getFullImageBlobUrl(fileId) {
            const blob = await fetchFullImageBlob(fileId);
            return URL.createObjectURL(blob);

        const HISTORICAL_TO_MODERN = {
            'SUN': 'RUS',  // USSR -> Russia

            'DDR': 'DEU',  // East Germany -> Germany

        let cvCountryMap = {};      // merged: {code: {own:[images], historical:{histCode:[images]}}}

        // Merges historical-entity folders (USSR, Ottoman Empire, etc.)
        // into the modern country they map to, so they can be shown as a
        // labeled subsection instead of appearing as their own map entry.
        function buildCountryMap(countries) {
            const map = {};
            countries.forEach(c => {
                const modern = HISTORICAL_TO_MODERN[c.code];
                if (modern) {
                    if (!map[modern]) map[modern] = { own: [], historical: {} };
                    map[modern].historical[c.code] = c.images;
                } else {
                    if (!map[c.code]) map[c.code] = { own: [], historical: {} };
                    map[c.code].own = map[c.code].own.concat(c.images);
                }
            });
            return map;
        }

        function countryTotalCount(entry) {
            return entry.own.length + Object.values(entry.historical).reduce((s, arr) => s + arr.length, 0);
